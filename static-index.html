<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三个 3D 网页游戏</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; background: #101522; color: #f4f6fb; font: 16px/1.6 system-ui, sans-serif }
    main { width: min(960px, 100%) }
    h1 { font-size: clamp(28px, 5vw, 48px); line-height: 1.2; margin: 0 0 8px }
    p { color: #aebbd0; margin: 0 0 32px }
    p a { display: inline; padding: 0; border: 0; background: none; color: #86c6fa; text-decoration: underline }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px }
    a { display: block; padding: 26px; border: 1px solid #344157; border-radius: 16px; color: inherit; text-decoration: none; background: #1b2537; transition: transform .2s, border-color .2s }
    a:hover, a:focus-visible { transform: translateY(-3px); border-color: #86c6fa }
    strong { display: block; font-size: 22px; margin: 12px 0 4px }
    span { color: #aebbd0 }
    .icon { font-size: 42px }
  </style>
</head>
<body>
  <main>
    <h1>三个 3D 网页游戏</h1>
    <p>选择一个游戏开始体验。游戏原作来自 <a href="https://github.com/riba2534/claude-opus-5-5-demo">riba2534</a>，由 <a href="https://github.com/PureTokens/claude-opus-5-5-demo">PureTokens</a> 整理。关注 <a href="https://x.com/pure_tokens">PureTokens X</a>。</p>
    <div class="grid">
      <a href="./pelican-bike/"><div class="icon">🚲</div><strong>鹈鹕骑自行车</strong><span>海岸公路休闲骑行</span></a>
      <a href="./cf-transport-ship/"><div class="icon">🔫</div><strong>穿越火线·运输船</strong><span>3D 团队枪战</span></a>
      <a href="./qq-speed/"><div class="icon">🏎️</div><strong>QQ 飞车</strong><span>竞速与漂移</span></a>
    </div>
  </main>
</body>
</html>
